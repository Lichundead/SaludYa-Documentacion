openapi: 3.0.0
info:
  title: API de SaludYa
  version: 1.0.0
  description: >-
    API REST para la gestión y agendamiento de citas médicas del proyecto SaludYa. Permite el
    registro e inicio de sesión de usuarios, la consulta de perfiles y la creación y consulta de
    citas médicas.
  contact:
    name: Equipo SaludYa
    url: https://github.com/Lichundead/saludYaCICD
  license:
    name: MIT
servers:
  - url: http://localhost:3001
    description: Servidor local de desarrollo
  - url: https://saludyacicd.onrender.com
    description: Servidor de producción (Render)
components:
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Paciente Demo
        email:
          type: string
          format: email
          example: demo@saludya.com
        password:
          type: string
          example: "123456"
        telefono:
          type: string
          example: "3000000000"
        tipo_id:
          type: string
          example: CC
        numero_id:
          type: string
          example: "12345678"
        rh:
          type: string
          example: O+
    Cita:
      type: object
      properties:
        id:
          type: integer
          example: 1
        paciente_email:
          type: string
          format: email
          example: demo@saludya.com
        especialidad:
          type: string
          example: Medicina general
        medico:
          type: string
          example: Paula García
        fecha:
          type: string
          format: date
          example: "2026-06-15"
        hora:
          type: string
          example: "09:30"
paths:
  /login:
    post:
      summary: Inicia sesión de un usuario
      description: Verifica las credenciales (correo y contraseña) contra la tabla de usuarios.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: demo@saludya.com
                password:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Resultado de la autenticación.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: "#/components/schemas/Usuario"
        "500":
          description: Error interno del servidor.
  /register:
    post:
      summary: Registra un nuevo usuario
      description: Crea un usuario (paciente) en la base de datos. El correo debe ser único.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - email
                - password
              properties:
                nombre:
                  type: string
                  example: Juan Pérez
                email:
                  type: string
                  format: email
                  example: juan@correo.com
                password:
                  type: string
                  example: claveSegura123
                telefono:
                  type: string
                  example: "3001234567"
                tipo_id:
                  type: string
                  example: CC
                numero_id:
                  type: string
                  example: "1090123456"
                rh:
                  type: string
                  example: O+
      responses:
        "200":
          description: Usuario registrado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    example: 4
  /usuario/{email}:
    get:
      summary: Obtiene un usuario por su correo
      tags:
        - Usuarios
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            format: email
          description: Correo electrónico del usuario a consultar.
          example: demo@saludya.com
      responses:
        "200":
          description: Datos del usuario encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: "#/components/schemas/Usuario"
  /citas:
    post:
      summary: Crea una nueva cita médica
      tags:
        - Citas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paciente_email
                - especialidad
                - medico
                - fecha
                - hora
              properties:
                paciente_email:
                  type: string
                  format: email
                  example: demo@saludya.com
                especialidad:
                  type: string
                  example: Medicina general
                medico:
                  type: string
                  example: Paula García
                fecha:
                  type: string
                  format: date
                  example: "2026-06-15"
                hora:
                  type: string
                  example: "09:30"
      responses:
        "200":
          description: Cita creada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    example: 7
  /citas/{email}:
    get:
      summary: Lista las citas de un paciente
      tags:
        - Citas
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            format: email
          description: Correo del paciente cuyas citas se desean consultar.
          example: demo@saludya.com
      responses:
        "200":
          description: Lista de citas del paciente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  citas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cita"
tags:
  - name: Autenticación
    description: Inicio de sesión y registro de usuarios
  - name: Usuarios
    description: Consulta de datos de usuarios
  - name: Citas
    description: Creación y consulta de citas médicas
