name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/swagger _site/jsdoc

          # Swagger UI + OpenAPI spec
          cp -r api/. _site/swagger/

          # JSDoc HTML
          cp -r codigo-documentado/jsdoc-html/. _site/jsdoc/

          # Landing page
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>SaludYa — Documentación Técnica</title>
            <style>
              *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: #f8fafc;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
              }
              .card-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 24px;
                max-width: 700px;
                width: 100%;
                margin-top: 36px;
              }
              .card {
                background: #fff;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                padding: 28px 24px;
                text-decoration: none;
                color: inherit;
                transition: box-shadow .2s, transform .2s;
              }
              .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.09); transform: translateY(-2px); }
              .card-icon { font-size: 36px; margin-bottom: 14px; }
              .card h2 { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
              .card p { font-size: 13.5px; color: #64748b; line-height: 1.6; }
              .card .tag {
                display: inline-block;
                margin-top: 14px;
                padding: 3px 10px;
                border-radius: 9999px;
                font-size: 11px;
                font-weight: 600;
              }
              .tag-green { background: #dcfce7; color: #15803d; }
              .tag-blue  { background: #dbeafe; color: #1d4ed8; }
              header { text-align: center; }
              header h1 { font-size: 32px; font-weight: 800; color: #2563eb; }
              header p  { margin-top: 10px; color: #475569; font-size: 15px; }
              footer { margin-top: 48px; font-size: 12px; color: #94a3b8; text-align: center; }
            </style>
          </head>
          <body>
            <header>
              <h1>SaludYa</h1>
              <p>Documentación técnica del sistema de gestión de citas médicas</p>
            </header>

            <div class="card-grid">
              <a class="card" href="swagger/">
                <div class="card-icon">🔌</div>
                <h2>API REST — Swagger</h2>
                <p>Documentación interactiva de los endpoints con OpenAPI 3.0. Prueba cada ruta directamente desde el navegador.</p>
                <span class="tag tag-green">OpenAPI 3.0</span>
              </a>

              <a class="card" href="jsdoc/documentacion.html">
                <div class="card-icon">📄</div>
                <h2>Código — JSDoc</h2>
                <p>Documentación de los módulos del backend: <code>server.js</code>, <code>database.js</code> y <code>swagger.js</code>.</p>
                <span class="tag tag-blue">JSDoc</span>
              </a>
            </div>

            <footer>
              Corporación Universitaria Iberoamericana &mdash; Proyecto de Software &mdash; MIT License
            </footer>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
